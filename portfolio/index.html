<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Nominoom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../components/navbar.css">
    <link rel="stylesheet" href="portfolio.css">
</head>
<body>
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>
    
    <!-- Load Navbar Component -->
    <script src="../components/navbar.js"></script>
    <script>
        fetch('../components/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
                // Initialize navbar animations after it's loaded
                if (typeof initNavbar === 'function') {
                    initNavbar();
                }
            })
            .catch(error => console.error('Error loading navbar:', error));
    </script>

    <!-- Background Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Main Content -->
    <main class="portfolio-main">
        <div class="portfolio-empty-container">
            <div class="empty-projects-panel">
                <div class="empty-icon">&lt;//&gt;</div>
                <h3>PORTFOLIO // NO PUBLIC PROJECTS LOADED</h3>
                <p>Projects are currently classified or under active development.</p>
            </div>
        </div>
    </main>

    <!-- Particle Canvas Script -->
    <script src="../javascrpt/quadtree.js"></script>
    <script src="../javascrpt/script.js"></script>
    <script src="portfolio.js?v=2"></script>
</body>
</html>
